<!-- cart.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giỏ hàng</title>
  <link rel="stylesheet" href="assets/css/cart.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"></script>
  <!-- Script chính -->
  <script type="module" src="assets/js/cart.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
    </nav>
  </header>

  <main>
    <h1>Giỏ hàng của bạn</h1>
    <ul id="cart-list"></ul>
    <div id="total-price">Tổng tiền: 0 đ</div>
    <button id="checkout-btn">Mua hàng</button>
  </main>

  <!-- Thêm đoạn này để bắt sự kiện nút "Mua hàng" -->
  <script type="module">
    import { checkout } from './assets/js/cart.js';

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("checkout-btn");
      if (btn) {
        btn.addEventListener("click", checkout);
      }
    });
  </script>
</body>
</html>
