<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Store</title>
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">Online Store</div>
    <nav>
      <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="login.html">Đăng nhập</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="cart.html">Giỏ hàng</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
      </ul>
    </nav>
    <div class="user-info" id="user-info" style="display: none;">
      Xin chào, <span id="username">Người dùng</span>!
      <button id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <!-- Banner -->
  <section class="banner">
    <img src="images/banner.jpg" alt="Banner">
  </section>

  <!-- Sản phẩm -->
  <section class="product-section">
    <h2>Sản phẩm nổi bật</h2>
    <div class="product-grid">
      <div class="product-card">
          <img src="images/ip16.jpg" alt="Sản phẩm 1">
          <h3>iPhone 16 Promax</h3>
          <p class="price">Giá: 35.000.000₫</p>
          <button>Đặt hàng</button>
          <button>Thêm vào giỏ hàng</button>
      </div>
      <div class="product-card">
          <img src="images/giaynike.jpg" alt="Sản phẩm 2">
          <h3>Giày Nike</h3>
          <p class="price">Giá: 999.000₫</p>
          <button>Đặt hàng</button>
          <button>Thêm vào giỏ hàng</button>
      </div>
      <div class="product-card">
          <img src="images/aohoodie.webp" alt="Sản phẩm 3">
          <h3>Áo Hoodie Champions</h3>
          <p class="price">Giá: 555.000₫</p>
          <button>Đặt hàng</button>
          <button>Thêm vào giỏ hàng</button>
      </div>
    </div>
  </section>

  <!-- Firebase Auth script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userInfoDiv = document.getElementById("user-info");
    const usernameSpan = document.getElementById("username");
    const logoutBtn = document.getElementById("logoutBtn");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const username = user.displayName || user.email;
        usernameSpan.textContent = username;
        userInfoDiv.style.display = "flex";
      } else {
        userInfoDiv.style.display = "none";
      }
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
